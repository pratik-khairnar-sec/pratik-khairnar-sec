name: Auto Sync Portfolio

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sync, repo_created]
  push:
    branches:
      - main
    paths:
      - 'scripts/sync_repos.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Synchronize Repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_repos.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No repository changes detected. Portfolio is up to date."
          else
            git commit -m "chore: auto-sync portfolio with latest repositories"
            git push
          fi
